# pyproject.toml

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "taikonation"
version = "1.0.0"
authors = [
  { name="myrqyry", email="author@example.com" },
]
description = "A cutting-edge AI system for human-like Taiko no Tatsujin beatmap generation."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/myrqyry/rhythm-tatsujin"
"Issues" = "https://github.com/myrqyry/rhythm-tatsujin/issues"
